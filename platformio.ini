; PlatformIO project config - ESP32 Flight Data Logger
;
; PlatformIO downloads the ESP32 toolchain and the three libraries itself on the
; first build, so if you work this way you do NOT need tools\setup.bat.
;
; To build the receiver instead of the logger, change src_dir below to
; ground_station and rebuild. PlatformIO only picks up .ino files sitting
; directly in src_dir, which is why this is a one-line swap rather than two
; environments.

[platformio]
src_dir = flight_logger
; src_dir = ground_station

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050
    adafruit/Adafruit BMP280 Library
    nrf24/RF24
